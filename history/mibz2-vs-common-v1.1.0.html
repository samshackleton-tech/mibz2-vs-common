const nowUtc = () => new Date().toISOString().slice(0, 19) + "Z";

function el(tag, attrs = {}, ...kids) {
const e = document.createElement(tag);
for (const [k, v] of Object.entries(attrs)) {
if (v == null) continue;
if (k === "style") Object.assign(e.style, v);
else if (k === "class") e.className = v;
else e.setAttribute(k, v);
}
e.append(.kids.flat(Infinity).filter(k => k != null && k !== false));
return e;
}

function renderValue(v) {
if (Array.isArray(v)) {
return el("ul", {}, v.map(x => el("li", {}, renderValue(x))));
}
if (v && typeof v === "object") {
return el("dl", { class: "kv" }, Object.entries(v).map(([k, x]) =>
[el("dt", {}, k), el("dd", {}, renderValue(x))]));
}
const s = String(v);
const m = s.match(/^(https?:\/\/\S+)(.*)$/s);
return m ? [el("a", { href: m[1] }, m[1]), m[2]] : s;
}

function build(rows) {
const data = {};
for (const [c, size, t, s, mbs, lb, rs, cl] of rows) {
data[c] ??= { size, t: {} };
data[c].t[t] = { s, mbs, r: { lbzip2: lb, "libbz2-rs": rs, libbzip2: cl } };
}
return data;
}

function checkRows(rows) {
if (!Array.isArray(rows) || !rows.length) throw new Error("no rows");
for (const r of rows) {
const bad = () => new Error("bad row " + JSON.stringify(r).slice(0, 60));
if (!Array.isArray(r) || r.length !== 8 || typeof r[0] !== "string") {
throw bad();
}
if (![r[2], r[3], r[4]].every(Number.isFinite)) throw bad();
for (const x of r.slice(5)) {
if (!Array.isArray(x) || x.length !== 3 || !x.every(Number.isFinite)) {
throw bad();
}
}
}
return rows;
}

function compare(a, b) {
const key = r => `${r[0]}/${r[2]}`;
const flat = r => [r[3], r[4], ...r[5], ...r[6], ...r[7]];
const m = new Map(a.map(r => [key(r), r]));
let n = 0, bad = Math.abs(a.length - b.length);
for (const r of b) {
const s = m.get(key(r));
if (!s) { bad++; continue; }
const fa = flat(s), fb = flat(r);
fa.forEach((x, i) => { n++; if (Math.abs(x - fb[i]) > 1e-9) bad++; });
}
return bad === 0
? `live page matches the pinned snapshot: all ${n} numbers equal`
: `live page differs from the pinned snapshot in ${bad} of ${n} numbers`;
}

// ---------- state ----------

let state = {
rows: SNAP_ROWS, data: build(SNAP_ROWS), src: SNAP_SRC, t: 4,
check: "pinned snapshot; live check pending",
};

function setRows(rows, src) {
state.rows = rows; state.data = build(rows); state.src = src;
}

// ---------- chart ----------

function scaleMax(data) {
let m = 1;
for (const c of Object.values(data))
for (const v of Object.values(c.t))
for (const r of Object.values(v.r)) m = Math.max(m, r[2]);
return Math.ceil(m);
}

function barRow(dec, ratio, lo, hi, t, max, label, tip) {
const n = dec.parallel ? t : 1;
const pips = el("div", {
class: "pips", title: `${n} thread${n > 1 ? "s" : ""}`,
}, Array.from({ length: n }, () => el("div", { class: "pip" })));
const u = 100 / ratio; // one mibz2-time, as % of this bar
const track = el("div", { class: "track" },
el("div", {
class: "bar", title: tip,
style: {
width: `${(ratio / max) * 100}%`,
background: `repeating-linear-gradient(90deg, ${dec.color} 0 ` +
`calc(${u}% - 2px), transparent calc(${u}% - 2px) ${u}%)`,
},
}),
lo == null ? null : el("div", {
class: "whisk", title: tip,
style: {
left: `${(lo / max) * 100}%`,
width: `${((hi - lo) / max) * 100}%`,
},
}),
el("span", {
class: "val",
style: { left: `${(Math.max(ratio, hi ?? 0) / max) * 100}%` },
}, label));
return el("div", { class: "row" },
el("div", { class: "name", style: { color: dec.color } }, dec.key),
pips, track);
}

function render() {
const { data, src } = state;
const threads = [...new Set(state.rows.map(r => r[2]))].sort((a, b) => a - b);
if (!threads.includes(state.t)) state.t = threads[threads.length - 1];
const t = state.t, max = scaleMax(data);

const seg = document.getElementById("threads");
seg.replaceChildren(el("span", {}, "threads"), threads.map(n => {
const b = el("button", { "aria-pressed": String(n === t) }, String(n));
b.onclick = () => { state.t = n; render(); };
return b;
}));

const grid = document.getElementById("grid");
grid.replaceChildren();
for (const [corpus, c] of Object.entries(data)) {
const v = c.t[t];
if (!v) continue;
grid.append(el("section", { class: "panel" },
el("h2", {}, corpus),
el("div", { class: "meta mute" },
`${c.size} · mibz2 ${v.s.toFixed(3)} s, ${v.mbs} MB/s`),
DECODERS.map(dec => {
if (dec.key === "mibz2") {
return barRow(dec, 1, null, null, t, max,
`${v.s.toFixed(3)} s`, "mibz2: 1× (reference)");
}
const [r, lo, hi] = v.r[dec.key];
const ver = (src.versions || {})[dec.key] || "?";
return barRow(dec, r, lo, hi, t, max, `${r.toFixed(2)}×`,
`${dec.key} ${ver}: ${r.toFixed(2)}× mibz2's wall time ` +
`(95% interval ${lo}–${hi})`);
})));
}
renderStamp();
renderProvView();
}

function renderStamp() {
const s = state.src, v = s.versions || {};
const a = (href, text) => (href ? el("a", { href }, text) : text);
document.getElementById("stamp").replaceChildren(
"Data: mibz2 ", a(s.commitUrl, s.commit || "?"),
s.pr ? [" (", a(s.prUrl, `PR #${s.pr}`), ")"] : null,
`, recorded ${s.date || "?"} · ${s.cpu || "?"} · ${s.rustc || "?"} · `,
`${s.bench || "?"} · ${s.rounds || "?"} rounds · `, a(s.runUrl, "run"),
` · lbzip2 ${v.lbzip2 || "?"} · libbz2-rs ${v["libbz2-rs"] || "?"}`,
` · libbzip2 ${v.libbzip2 || "?"}`, el("br"),
`Source: ${s.mode} of `, a(s.from, s.from), ` (${s.fetched})`,
` · ${state.check} · rendered ${nowUtc()} · ${PAGE.name} v${PAGE.version}`,
" · one block = mibz2's time · whisker = 95% interval");
}

// ---------- provenance panel ----------

function renderProvView() {
const s = state.src;
document.getElementById("provView").replaceChildren(
el("h3", {}, "Data in view"),
renderValue({
source: `${s.mode}: ${s.from}`,
fetched: s.fetched,
commit: s.commitUrl || s.commitFull || s.commit || "?",
recorded: s.date || "?",
pull_request: s.prUrl || "?",
cpu: s.cpu || "?", rustc: s.rustc || "?",
bench: s.bench || "?", rounds: s.rounds || "?",
run: s.runUrl || "?",
versions: s.versions || {},
check: state.check,
}),
el("p", {},
el("button", { class: "btn", id: "export" }, "Save data.json"),
" the data in view, its source, and the full provenance below"));
document.getElementById("export").onclick = exportJson;
}

function renderProvStatic() {
document.getElementById("provStatic").replaceChildren(
el("h3", {}, `Measurement (record ${SHA.slice(0, 7)} only)`),
renderValue(PROV.measured),
el("h3", {}, "Inputs"), renderValue(PROV.inputs),
el("h3", {}, "Decoders"), renderValue(PROV.decoders),
el("h3", {}, "This file"), renderValue(PROV.file),
el("h3", {}, "Not captured"), renderValue(PROV.gaps),
el("h3", {}, "Reproduce and modify"),
REPRO.map(step => [el("p", {}, step.t), el("pre", {}, step.sh.join("\n"))]),
el("p", {}, "data.json row layout: " + ROW_LAYOUT.join(" | ")));
}

function exportJson() {
const out = {
schema: SCHEMA, exported: nowUtc(), page: PAGE,
row_layout: ROW_LAYOUT, view: state.src, check: state.check,
rows: state.rows, provenance: PROV,
};
const blob = new Blob([JSON.stringify(out, null, 2)],
{ type: "application/json" });
const link = el("a", { href: URL.createObjectURL(blob), download: "data.json" });
document.body.append(link); link.click(); link.remove();
}

// ---------- loading ----------

function parseLive(html, url) {
const doc = new DOMParser().parseFromString(html, "text/html");
const abs = h => (h ? new URL(h, url).href : null);
const h2 = [...doc.querySelectorAll("h2")]
.find(e => /Wall time against mibz2/i.test(e.textContent));
let node = h2 && h2.nextElementSibling, table = null;
while (node && !table && node.tagName !== "H2") {
table = node.matches("table") ? node : node.querySelector("table");
node = node.nextElementSibling;
}
if (!table) throw new Error("wall-time table not found");

const heads = [...table.querySelectorAll("thead th")]
.map(th => th.textContent.replace(/[¹\s]+$/u, "").trim());
const col = name => {
const i = heads.indexOf(name);
if (i < 0) throw new Error(`column '${name}' missing`);
return i;
};
const iC = col("corpus"), iT = col("threads");
const iS = col("mibz2 wall (median)"), iM = col("mibz2 MB/s");
const iDec = ["lbzip2", "libbz2-rs", "libbzip2"].map(col);
const ratio = s => {
const m = s.match(/([\d.]+)×\s*\(([\d.]+)[–-]([\d.]+)\)/);
if (!m) throw new Error(`bad ratio '${s}'`);
return m.slice(1, 4).map(Number);
};
const rows = [...table.querySelectorAll("tbody tr")].map(tr => {
const td = [...tr.children].map(x => x.textContent.trim());
const cm = td[iC].match(/^(\S+)\s*\(([^,]+),/);
if (!cm) throw new Error(`bad corpus '${td[iC]}'`);
return [cm[1], cm[2].trim(), +td[iT], parseFloat(td[iS]),
parseFloat(td[iM]), ...iDec.map(i => ratio(td[i]))];
});
checkRows(rows);

const text = doc.body.textContent;
const ver = re => (text.match(re) || [])[1] || "?";
const latest = [...doc.querySelectorAll("p")]
.find(p => /The latest record/.test(p.textContent));
const cLink = latest && latest.querySelector('a[href*="/commit/"]');
if (!cLink) throw new Error("commit link not found");
const commitUrl = abs(cLink.getAttribute("href"));
const envP = [...doc.querySelectorAll("p")]
.find(p => /rustc/.test(p.textContent));
const env = envP ? envP.textContent.split("·").map(x => x.trim()) : [];
const pr = doc.querySelector('a[href*="/pull/"]');
const run = doc.querySelector('a[href*="/actions/runs/"]');
return {
rows,
src: {
mode: "live fetch", from: url, fetched: nowUtc(),
commit: cLink.textContent.trim(),
commitFull: commitUrl.split("/commit/")[1] || "",
commitUrl,
pr: pr ? (pr.textContent.match(/#(\d+)/) || [])[1] : null,
prUrl: pr ? abs(pr.getAttribute("href")) : null,
date: (latest.textContent.match(/\d{4}-\d{2}-\d{2}/) || ["?"])[0],
cpu: env[0] || "?", rustc: env[1] || "?", bench: env[2] || "?",
rounds: (text.match(/(\d+) rounds on one runner/) || [])[1] || "?",
runUrl: run ? abs(run.getAttribute("href")) : url,
versions: {
lbzip2: ver(/\blbzip2 (\d+(?:\.\d+)+)/),
"libbz2-rs": ver(/libbz2-rs (\d+(?:\.\d+)+)/),
libbzip2: ver(/libbzip2 (\d+(?:\.\d+)+)/),
},
},
};
}

async function fetchLive(url) {
const r = await fetch(url, { cache: "no-store" });
if (!r.ok) throw new Error(`HTTP ${r.status}`);
return parseLive(await r.text(), url);
}

async function fetchData(url) {
const r = await fetch(url, { cache: "no-store" });
if (!r.ok) throw new Error(`HTTP ${r.status}`);
const j = await r.json();
if (j.schema !== SCHEMA) throw new Error(`schema is not ${SCHEMA}`);
return {
rows: checkRows(j.rows),
src: {
...(j.view || {}), mode: "loaded data.json",
from: new URL(url, location.href).href, fetched: nowUtc(),
},
};
}

(async () => {
renderProvStatic();
render();
const dataUrl = Q.get("data");
if (!dataUrl && Q.has("pinned")) {
state.check = "pinned: no network used";
render();
return;
}
const url = dataUrl || Q.get("source") || DEFAULT_SOURCE;
try {
const got = dataUrl ? await fetchData(dataUrl) : await fetchLive(url);
setRows(got.rows, got.src);
if (dataUrl) {
state.check = "loaded data: not compared with the snapshot";
} else if (got.src.commitFull === SHA) {
state.check = compare(SNAP_ROWS, got.rows);
} else {
state.check = `live record ${got.src.commit} is not the pinned ` +
`${SHA.slice(0, 7)}, so it wasn't compared; the run, artifact and ` +
"build details below describe the pinned record only";
}
} catch (e) {
state.check = `fetching ${url} failed (${e.message || e}); ` +
"showing the pinned snapshot";
}
render();
})();
</script>
</body>
</html>'
